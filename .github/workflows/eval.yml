name: Run Skill Evaluations

on:
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "skills/**"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    name: Run Evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          github_access_token: ${{ github.token }}
          nix_conf: |
            access-tokens = github.com=${{ github.token }}
      - uses: Mic92/niks3-action@bc010bf9dbc79ec59de6c79b1e7a167977d3978b # v1.0.0
        with:
          server-url: https://niks3.yutakobayashi.com
          skip-push: true
      - name: Run evaluations
        run: nix run .#waza -- run --output-dir ./results
